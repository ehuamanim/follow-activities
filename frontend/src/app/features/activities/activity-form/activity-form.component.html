<div class="p-6 max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">{{ isEditMode ? 'Editar actividad' : 'Nueva actividad' }}</h1>
    <button (click)="cancel()" class="text-gray-500 hover:text-gray-700 text-sm">← Volver</button>
  </div>

  <div *ngIf="errorMessage" class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded mb-4">{{ errorMessage }}</div>
  <div *ngIf="loading" class="text-center text-gray-500 py-10">Cargando...</div>

  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow p-6 space-y-4">
    <div *ngIf="!isEditMode" class="flex justify-end">
      <button type="button" (click)="copyPrevious()" class="text-sm text-indigo-600 hover:underline">Copiar actividad anterior</button>
    </div>

    <div>
      <label for="project_id" class="block text-sm font-medium text-gray-700 mb-1">Proyecto</label>
      <select id="project_id" formControlName="project_id" class="w-full border border-gray-300 rounded-md px-3 py-2">
        <option value="">-- Seleccionar --</option>
        <option *ngFor="let project of projects" [value]="project.id">{{ project.name }}</option>
      </select>
    </div>

    <div>
      <label for="activity_date" class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
      <input id="activity_date" type="date" formControlName="activity_date" class="w-full border border-gray-300 rounded-md px-3 py-2" />
    </div>

    <div>
      <label for="hours" class="block text-sm font-medium text-gray-700 mb-1">Horas</label>
      <input id="hours" type="number" step="0.5" min="0.5" formControlName="hours" class="w-full border border-gray-300 rounded-md px-3 py-2" />
    </div>

    <div>
      <label for="tasks" class="block text-sm font-medium text-gray-700 mb-1">Tareas</label>
      <textarea id="tasks" formControlName="tasks" rows="4" class="w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" [disabled]="submitting" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md disabled:opacity-50">
        {{ submitting ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" (click)="cancel()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-md">Cancelar</button>
    </div>
  </form>

  <div *ngIf="isEditMode && activityId" class="bg-white rounded-lg shadow p-6 mt-6 space-y-4">
    <h2 class="text-lg font-semibold">Comentarios</h2>
    <div *ngFor="let c of comments" class="border-b py-2 text-sm">
      <div class="text-gray-500 text-xs">{{ c.user_surnames }}, {{ c.user_name }} · {{ c.created_at | fechaPe }}</div>
      <div>{{ c.body }}</div>
    </div>
    <div class="flex gap-2">
      <input [(ngModel)]="newComment" class="flex-1 border rounded px-3 py-2" placeholder="Escribe un comentario" />
      <button type="button" (click)="addComment()" class="bg-blue-600 text-white px-3 py-2 rounded">Enviar</button>
    </div>

    <h2 class="text-lg font-semibold pt-4">Adjuntos</h2>
    <input type="file" (change)="onFile($event)" accept=".pdf,.png,.jpg,.jpeg,.xlsx" />
    <ul class="space-y-1 text-sm">
      <li *ngFor="let a of attachments" class="flex justify-between">
        <span>{{ a.original_name }} ({{ a.size_bytes }} bytes)</span>
        <button type="button" (click)="downloadAttachment(a)" class="text-blue-600 hover:underline">Descargar</button>
      </li>
    </ul>
  </div>
</div>
